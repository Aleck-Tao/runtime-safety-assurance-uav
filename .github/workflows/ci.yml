name: runtime-assurance-reproducibility

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '41 1 * * 1'

jobs:
  test-and-reproduce:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Validate assurance model
        run: runtime-assurance validate --root .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Verify committed provenance
        run: runtime-assurance verify --root .
      - name: Reproduce threshold and persistence study
        run: runtime-assurance persistence-study --root . --check
      - name: Regenerate benchmark evidence
        run: runtime-assurance benchmark --root .
      - name: Verify regenerated provenance
        run: runtime-assurance verify --root .
      - name: Verify committed evidence
        run: git diff --exit-code -- data/generated results
